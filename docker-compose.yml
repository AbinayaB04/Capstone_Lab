services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: studymate_backend
    ports:
      - "8002:8000"
    volumes:
      - ./:/app
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - studymate_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: studymate_frontend
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000
    volumes:
      - ./:/app
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - studymate_network

  redis:
    image: redis/redis-stack:latest
    container_name: studymate_redis
    ports:
      - "8001:8001" # RedisInsight UI
    networks:
      - studymate_network

networks:
  studymate_network:
    driver: bridge
